[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windesktopctl"
version = "0.1.0"
description = "Local Windows desktop observe/control helper (UIA + OCR + input) exposed as an MCP server and a CLI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.8,<2",
    "mss>=9.0",
    "pillow>=10.0",
    "uiautomation>=2.0",
    "comtypes>=1.2",
    "winocr>=0.0.15",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
windesktopctl = "windesktopctl.cli:main"
windesktopctl-mcp = "windesktopctl.mcp_server:main"

[tool.setuptools.packages.find]
include = ["windesktopctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
